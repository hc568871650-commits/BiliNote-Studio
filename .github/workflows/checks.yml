name: Studio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BillNote_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: BillNote_frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm exec vite build --mode tauri
        env:
          VITE_API_BASE_URL: http://127.0.0.1:38484/api
          VITE_BILINOTE_DISTRIBUTION: installer
          VITE_BILINOTE_LOCAL_WHISPER: "0"
  runtime-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install python-dotenv==1.1.0
      - run: python -m unittest tests.test_installed_runtime tests.test_portable_editions
        working-directory: backend
